name: apply-reference-select-migration

on:
  push:
    branches: [feature/reference-data-all-selects]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reference-data-all-selects
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/apply-reference-select-migration.py
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit code and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package-lock.json
          git commit -m "Move frontend select values to reference data and sync lockfile"
          git push origin HEAD:feature/reference-data-all-selects
