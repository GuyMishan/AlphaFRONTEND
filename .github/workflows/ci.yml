name: frontend-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-hardcoded-select-options.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
